[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcm-platform"
version = "0.1.0"
description = "RCM automation platform - claim lifecycle, rules engine, denial management"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    # starlette>=1.6 requires httpx2 for TestClient; with filterwarnings=error
    # the deprecation shim is a hard failure, which is the behaviour we want.
    "httpx2>=2.12",
    "hypothesis>=6.122",
    # Pinned, not floated. `tests/unit/test_tooling_pins.py` asserts this matches
    # the `rev:` in .pre-commit-config.yaml, and a floating lower bound means the
    # two drift apart on whatever day the next developer runs `make install`.
    # Bump both together, in one commit.
    "ruff==0.16.5",
    "mypy>=1.13,<2",
    "import-linter>=2.1",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "types-python-dateutil",
    # tools/synthetic reads its payer mix and volumes from YAML (M0.10).
    "pyyaml>=6.0",
    # tools/check_coverage_floor.py parses the coverage report; the stdlib XML
    # parser is vulnerable to entity-expansion attacks and bandit flags it (B314).
    "defusedxml>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rcm"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes -- every timestamp here is TIMESTAMPTZ
    "T20",         # no print(): output goes through structlog so the PHI scrubber sees it
    "SIM",
    "PTH",
    "RUF",
    "S",           # bandit rules inline
    "ANN",         # annotations required -- mypy strict needs them anyway
]
ignore = [
    "ANN401",      # Any is occasionally correct (JSONB payloads)
    "S101",        # assert: allowed, and required in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**"   = ["S", "ANN", "PLR2004"]
"tools/**"   = ["S311"]              # non-crypto RNG is correct for synthetic data
# The synthetic generator (M0.10) is a developer CLI, not production code: it
# never runs in a deployed environment, never touches PHI, and prints a console
# report rather than emitting telemetry. Annotating it to mypy-strict standards
# would be effort spent where a defect costs a regenerated corpus rather than a
# wrong number in a ledger. See docs/decisions/ADR-0004-synthetic-generator-lint-scope.md.
# mypy does not cover it at all -- `packages = ["rcm"]` excludes tools/.
"tools/synthetic/**" = [
    "ANN",    # annotations: see ADR-0004
    "T201",   # print(): this is a CLI whose output is a console report
    "E741",   # `l` as a loop variable over X12 loops, matching the spec's own naming
    "RUF001", # the X12 reference data contains non-ASCII payer names verbatim
    "N802",   # function names mirror X12 segment names (ISA, GS, SE)
    "N806",   # D() and A() name digit and alpha generators, matching payer id specs
    "SIM",    # readability rewrites not worth re-validating generated output over
    "RUF005", # list concatenation, likewise
    "RUF059", # unused unpacked values from a documented multi-return build()
    "F841",   # locals kept as self-documentation of the adjudication steps
    "E731",   # short lambdas for per-payer member-id formats read better inline
    "E702",   # `print(...); return 1` guard clauses
]
"migrations/**" = ["ANN", "E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["rcm"]

# ---------------------------------------------------------------------------
# mypy -- strict, no exceptions granted without an ADR
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rcm"]

[[tool.mypy.overrides]]
module = ["celery.*", "structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -ra shows the reason for every non-passing test, including skips.
# A skipped test is a failing test (CLAUDE.md section 7.5) -- it must be visible.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires Postgres and Redis",
    "security: security control tests (CLAUDE.md section 6.3)",
    "invariant: named invariant test from CLAUDE.md section 7.2",
    "edge_case: maps to an EC-nn in docs/02_Domain_and_Functional.md section 13",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/rcm"]
# Each suite writes its own data file (COVERAGE_FILE=.coverage.<suite>) and
# `coverage combine` merges them before the floor is checked, because the three
# guarded packages are not all exercised by one suite -- the ORM models in
# rcm.domain are driven by the integration and security suites, which run
# against a database the unit job does not have. Recording paths relative to the
# repository root lets those files combine even when they were produced in
# different CI jobs or checkouts.
relative_files = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
